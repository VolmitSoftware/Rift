# Rift — pl_PL
#
# === Edycja pliku ===
# plugins/Rift/languages/pl_PL.toml
# Ten plik można edytować bezpośrednio. Lokalne zmiany są zachowywane; brakujące lub nieprawidłowe wpisy korzystają z wbudowanego angielskiego tekstu.
# /rift language server edit pl_PL
#
# === Prefiks ===
# runtime.prefix przechowuje sformatowaną nazwę wtyczki używaną przez {prefix}. Separator i odstępy dodają poszczególne wiadomości. Usuń {prefix}&r &7› &7, aby ukryć cały prefiks czatu.
#
# === Formatowanie ===
# Kolory: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B i [RRGGBB]. MiniMessage pozostaje dostępny dla własnego formatowania. Poprzedź & lub [ odwrotnym ukośnikiem, aby wyświetlić je dosłownie.
#
# === Zmienne ===
# Zachowaj nazwy zmiennych i używaj tylko tych, które występują w danej wiadomości.
#   {added}  liczba wiadomości dodanych przez aktualizację języka
#   {after}  nowa wartość
#   {argument}  argument polecenia
#   {before}  poprzednia wartość
#   {category}  kategoria
#   {command}  ścieżka polecenia
#   {count}  liczba wpisów
#   {detail}  szczegóły wpisu
#   {group}  grupa wiadomości
#   {id}  identyfikator kwarantanny
#   {kept}  lokalne edycje zachowane przez aktualizację języka
#   {key}  klucz parametru
#   {label}  etykieta wyświetlana
#   {line}  numer linii
#   {locale}  kod języka
#   {maximum}  maksymalna długość wpisanego tekstu
#   {name}  nazwa wpisu
#   {operation}  nazwa operacji
#   {parameter}  nazwa parametru
#   {permission}  węzeł uprawnienia
#   {personal}  osobisty język gracza, jeśli różni się od domyślnego języka serwera
#   {player}  nazwa gracza
#   {prefix}  sformatowana nazwa z runtime.prefix; separator i odstępy należą do każdej wiadomości
#   {reason}  powód lub szczegóły błędu
#   {remaining}  czas pozostały do kolejnego dozwolonego sprawdzenia języków
#   {seconds}  czas w sekundach
#   {setting}  nazwa ustawienia
#   {target}  cel wyboru
#   {title}  tytuł sekcji
#   {type}  typ wartości
#   {updated}  liczba wiadomości zmienionych przez aktualizację języka
#   {value}  bieżąca lub nowa wartość
#   {variables}  dozwolone symbole zastępcze
#   {version}  wersja wtyczki
#   {world}  nazwa świata

#   {section}  sekcja edytora
#   {path}  ścieżka lokalnego raportu
#   {url}  adres URL przesłanego raportu

#   {step}  zmiana wartości liczbowej na jedno kliknięcie

#   {limit}  maksymalna liczba graczy wpuszczanych do świata

