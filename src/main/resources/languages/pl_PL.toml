# Rift — pl_PL
#
# === Edycja pliku ===
# plugins/Rift/languages/pl_PL.toml
# Ten plik można edytować bezpośrednio. Lokalne zmiany są zachowywane; brakujące lub nieprawidłowe wpisy korzystają z wbudowanego angielskiego tekstu.
# /rift language server edit pl_PL
#
# === Prefiks ===
# Prefiks: {prefix}=globalna wartość runtime.prefix. Usuń {prefix} z pojedynczej wiadomości, aby ukryć go tylko tam.
#
# === Formatowanie ===
# Kolory: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B i [RRGGBB]. MiniMessage pozostaje dostępny dla własnego formatowania.
#
# === Zmienne ===
# Zachowaj nazwy zmiennych i używaj tylko tych, które występują w danej wiadomości.
#   {after}  nowa wartość
#   {argument}  argument polecenia
#   {before}  poprzednia wartość
#   {category}  kategoria poleceń
#   {command}  tekst lub nazwa polecenia
#   {count}  liczba elementów lub wyników
#   {detail}  szczegół opisowy
#   {group}  Zezwolenie lub grupa graczy
#   {id}  identyfikator
#   {key}  klucz konfiguracji lub wiadomości
#   {label}  etykieta wyświetlana
#   {line}  Numer linii źródłowej lub linii
#   {locale}  ustawienie regionalne języka
#   {maximum}  Maksymalna dopuszczalna wartość
#   {name}  nazwa wpisu lub wyświetlana
#   {operation}  nazwa operacji
#   {parameter}  nazwa parametru
#   {permission}  węzeł uprawnienia
#   {personal}  osobiste ustawienie regionalne
#   {player}  nazwa gracza
#   {plugin}  Nazwa wtyczki
#   {prefix}  globalna wartość runtime.prefix. Usuń {prefix} z pojedynczej wiadomości, aby ukryć go tylko tam.
#   {reason}  powód lub szczegóły błędu
#   {seconds}  czas w sekundach
#   {setting}  nazwa ustawienia
#   {target}  Gracz docelowy, podmiot lub wartość
#   {title}  tekst tytułu
#   {type}  typ wartości lub danych
#   {usage}  tekst użycia polecenia
#   {value}  bieżąca lub nowa wartość
#   {variables}  dozwolone symbole zastępcze
#   {version}  wersja
#   {world}  nazwa świata

