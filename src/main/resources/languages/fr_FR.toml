# Rift — fr_FR
#
# === Modifier le fichier ===
# plugins/Rift/languages/fr_FR.toml
# Ce fichier peut être modifié directement. Les modifications locales sont conservées ; les entrées manquantes ou invalides utilisent l’anglais intégré.
# /rift language server edit fr_FR
#
# === Préfixe ===
# runtime.prefix contient uniquement le nom mis en forme. {prefix} insère ce nom ; › et les espaces se modifient dans chaque message.
#
# === Mise en forme ===
# Couleurs : &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B et [RRGGBB]. MiniMessage reste disponible pour les formats personnalisés.
#
# === Variables ===
# Conservez les noms des variables et utilisez uniquement celles du message concerné.
#   {added}  messages ajoutés par une mise à jour de langue
#   {after}  nouvelle valeur
#   {argument}  argument de commande
#   {before}  valeur précédente
#   {category}  catégorie
#   {command}  chemin de la commande
#   {count}  nombre d'entrées
#   {detail}  détail de l'entrée
#   {group}  groupe de messages
#   {id}  identifiant de quarantaine
#   {kept}  modifications locales conservées par une mise à jour de langue
#   {key}  clé du paramètre ou du message
#   {label}  libellé affiché
#   {line}  numéro de ligne
#   {locale}  code de langue
#   {maximum}  longueur maximale de la saisie
#   {name}  nom de l'entrée
#   {operation}  nom de l'opération
#   {parameter}  nom du paramètre
#   {permission}  nœud de permission
#   {personal}  langue personnelle d'un joueur lorsqu'elle diffère de la langue par défaut du serveur
#   {player}  nom du joueur
#   {prefix}  nom mis en forme issu de runtime.prefix ; les séparateurs et les espaces appartiennent à chaque message
#   {reason}  détail de l'échec
#   {remaining}  délai restant avant la prochaine vérification des langues
#   {seconds}  durée en secondes
#   {setting}  nom du réglage
#   {target}  cible de la sélection
#   {title}  texte du titre
#   {type}  type de valeur ou de donnée
#   {updated}  messages modifiés par une mise à jour de langue
#   {value}  valeur actuelle ou nouvelle
#   {variables}  variables valides
#   {version}  version
#   {world}  nom du monde

#   {section}  section de l’éditeur
#   {path}  chemin du rapport local
#   {url}  URL du rapport envoyé

#   {step}  variation numérique par clic

#   {limit}  nombre maximal de joueurs admis dans un monde

