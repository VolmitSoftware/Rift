# Rift — fr_FR
#
# === Modifier le fichier ===
# plugins/Rift/languages/fr_FR.toml
# Ce fichier peut être modifié directement. Les modifications locales sont conservées ; les entrées manquantes ou invalides utilisent l’anglais intégré.
# /rift language server edit fr_FR
#
# === Préfixe ===
# Préfixe : {prefix}=la valeur globale runtime.prefix. Retirez {prefix} d’un message pour le masquer uniquement à cet endroit.
#
# === Mise en forme ===
# Couleurs : &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B et [RRGGBB]. MiniMessage reste disponible pour les formats personnalisés.
#
# === Variables ===
# Conservez les noms des variables et utilisez uniquement celles du message concerné.
#   {after}  nouvelle valeur
#   {argument}  argument de commande
#   {before}  valeur précédente
#   {category}  catégorie de commande
#   {command}  texte ou nom de commande
#   {count}  nombre d'éléments ou de résultats
#   {detail}  détail descriptif
#   {group}  Autorisation ou groupe de joueurs
#   {id}  identifiant
#   {key}  clé de configuration ou de message
#   {label}  libellé affiché
#   {line}  Ligne source ou numéro de ligne
#   {locale}  paramètre régional de langue
#   {maximum}  Valeur maximale autorisée
#   {name}  nom d'entrée ou d'affichage
#   {operation}  nom de l'opération
#   {parameter}  nom du paramètre
#   {permission}  nœud de permission
#   {personal}  code régional personnel
#   {player}  nom du joueur
#   {plugin}  Nom du greffon
#   {prefix}  la valeur globale runtime.prefix. Retirez {prefix} d’un message pour le masquer uniquement à cet endroit.
#   {reason}  raison ou détail de l'erreur
#   {seconds}  durée en secondes
#   {setting}  nom du réglage
#   {target}  Lecteur cible, entité ou valeur
#   {title}  texte du titre
#   {type}  type de valeur ou de donnée
#   {usage}  texte d'utilisation de la commande
#   {value}  valeur actuelle ou nouvelle
#   {variables}  variables valides
#   {version}  version
#   {world}  nom du monde

