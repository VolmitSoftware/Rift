# Rift — ru_RU
#
# === Редактирование файла ===
# plugins/Rift/languages/ru_RU.toml
# Этот файл можно редактировать напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /rift language server edit ru_RU
#
# === Префикс ===
# runtime.prefix хранит оформленное имя плагина, которое подставляет {prefix}. Разделитель и пробелы задаются в самих сообщениях. Удалите {prefix}&r &7› &7, чтобы полностью скрыть префикс чата.
#
# === Форматирование ===
# Цвета и стили: &0-&f, &k-&r. Цвета RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B и [RRGGBB]. Для своего оформления также доступен MiniMessage. Чтобы вывести & или [ буквально, поставьте перед ними обратную косую черту.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только переменные исходного сообщения.
#   {added}  число сообщений, добавленных обновлением языка
#   {after}  новое значение
#   {argument}  аргумент команды
#   {before}  предыдущее значение
#   {category}  категория
#   {command}  текст или имя команды
#   {count}  количество элементов или результатов
#   {detail}  описательная подробность
#   {group}  группа сообщений
#   {id}  идентификатор карантина
#   {kept}  локальные правки, сохранённые при обновлении языка
#   {key}  ключ параметра или сообщения
#   {label}  отображаемая метка
#   {line}  номер строки
#   {locale}  код языка
#   {maximum}  максимальная длина ввода
#   {name}  имя записи или отображаемое имя
#   {operation}  имя операции
#   {parameter}  имя параметра
#   {permission}  узел разрешения
#   {personal}  личный язык игрока, если он отличается от языка сервера по умолчанию
#   {player}  имя игрока
#   {prefix}  оформленное имя из runtime.prefix; разделители и пробелы задаются в каждом сообщении
#   {reason}  причина или подробность ошибки
#   {remaining}  время до следующей разрешённой проверки языков
#   {seconds}  длительность в секундах
#   {setting}  имя настройки
#   {target}  цель выбора
#   {title}  текст заголовка
#   {type}  тип значения или данных
#   {updated}  число сообщений, изменённых обновлением языка
#   {value}  текущее или новое значение
#   {variables}  допустимые заполнители
#   {version}  версия плагина
#   {world}  имя мира

#   {section}  раздел редактора
#   {path}  путь к локальному отчёту
#   {url}  URL отправленного отчёта

#   {step}  шаг изменения за одно нажатие

#   {limit}  максимальное число игроков

