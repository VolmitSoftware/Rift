# Rift — ru_RU
#
# === Редактирование файла ===
# plugins/Rift/languages/ru_RU.toml
# Этот файл можно редактировать напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /rift language server edit ru_RU
#
# === Префикс ===
# runtime.prefix содержит только оформленное имя. {prefix} вставляет имя; › и пробелы редактируются в каждом сообщении.
#
# === Форматирование ===
# Цвета: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B и [RRGGBB]. Для своего оформления также доступен MiniMessage.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только переменные исходного сообщения.
#   {after}  новое значение
#   {argument}  аргумент команды
#   {before}  предыдущее значение
#   {category}  категория команд
#   {command}  текст или имя команды
#   {count}  количество элементов или результатов
#   {detail}  описательная подробность
#   {group}  Разрешение или группа игроков
#   {id}  идентификатор
#   {key}  ключ конфигурации или сообщения
#   {label}  отображаемая метка
#   {line}  Источник строки или номер строки
#   {locale}  языковой стандарт
#   {maximum}  Максимально допустимая стоимость
#   {name}  имя записи или отображаемое имя
#   {operation}  имя операции
#   {parameter}  имя параметра
#   {permission}  узел разрешения
#   {personal}  личная локаль
#   {player}  имя игрока
#   {prefix}  runtime.prefix содержит только оформленное имя. {prefix} вставляет имя; › и пробелы редактируются в каждом сообщении.
#   {reason}  причина или подробность ошибки
#   {seconds}  длительность в секундах
#   {setting}  имя настройки
#   {target}  Целевой игрок, сущность или ценность
#   {title}  текст заголовка
#   {type}  тип значения или данных
#   {value}  текущее или новое значение
#   {variables}  допустимые заполнители
#   {version}  версия
#   {world}  имя мира

#   {section}  Раздел редактора
#   {path}  Путь к локальному отчёту
#   {url}  URL отчёта

