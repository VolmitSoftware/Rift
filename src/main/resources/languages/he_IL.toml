# Rift — he_IL
#
# === עריכת הקובץ ===
# plugins/Rift/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים נשמרים; ערכים חסרים או לא תקינים משתמשים באנגלית המובנית.
# /rift language server edit he_IL
#
# === קידומת ===
# runtime.prefix שומר את שם התוסף המעוצב ש־{prefix} מציג. ההודעות עצמן מספקות את המפריד ואת הרווחים. הסירו את {prefix}&r &7› &7 כדי להסתיר את קידומת הצ׳אט כולה.
#
# === עיצוב ===
# צבעים וסגנונות: &0-&f, &k-&r. צבעי RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B וגם [RRGGBB]. ניתן להשתמש גם ב־MiniMessage לעיצוב מותאם. כדי להציג & או [ כפשוטם, הוסיפו לפניהם לוכסן הפוך.
#
# === משתנים ===
# יש לשמור על שמות המשתנים ולהשתמש רק במשתנים הקיימים בכל הודעה.
#   {added}  הודעות שנוספו בעדכון שפה
#   {after}  הערך החדש
#   {argument}  ארגומנט פקודה
#   {before}  הערך הקודם
#   {category}  קטגוריה
#   {command}  טקסט או שם הפקודה
#   {count}  מספר פריטים או תוצאות
#   {detail}  פרט תיאורי
#   {group}  קבוצת הודעות
#   {id}  מזהה הסגר
#   {kept}  עריכות מקומיות שנשמרו בעדכון שפה
#   {key}  מפתח פרמטר או הודעה
#   {label}  תווית תצוגה
#   {line}  מספר שורה
#   {locale}  קוד שפה
#   {maximum}  אורך קלט מרבי
#   {name}  שם רשומה או שם תצוגה
#   {operation}  שם הפעולה
#   {parameter}  שם הפרמטר
#   {permission}  צומת הרשאה
#   {personal}  השפה האישית של שחקן כשהיא שונה מברירת המחדל של השרת
#   {player}  שם השחקן
#   {prefix}  השם המעוצב מ־runtime.prefix; המפרידים והרווחים שייכים לכל הודעה
#   {reason}  סיבה או פרטי שגיאה
#   {remaining}  הזמן שנותר עד שתותר בדיקת השפות הבאה
#   {seconds}  משך בשניות
#   {setting}  שם ההגדרה
#   {target}  יעד הבחירה
#   {title}  טקסט הכותרת
#   {type}  סוג הערך או הנתון
#   {updated}  הודעות ששונו בעדכון שפה
#   {value}  הערך הנוכחי או החדש
#   {variables}  מצייני מקום מותרים
#   {version}  גרסת התוסף
#   {world}  שם העולם

#   {section}  מקטע בעורך
#   {path}  נתיב הדוח המקומי
#   {url}  כתובת הדוח שהועלה

#   {step}  גודל השינוי בכל לחיצה

#   {limit}  מספר שחקנים מרבי

[runtime]
prefix = "<bold><gradient:#6f2dbd:#d16ba5>Rift</gradient></bold>"

[rift.world]
already_exists = "{prefix}&r &7› &7&e{world} כבר קיים. השתמשו ב־&f/rift info {world}&e לבדיקה, או בחרו שם אחר."

