# Rift — he_IL
#
# === עריכת הקובץ ===
# plugins/Rift/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים נשמרים; ערכים חסרים או לא תקינים משתמשים באנגלית המובנית.
# /rift language server edit he_IL
#
# === קידומת ===
# runtime.prefix מכיל רק את השם המעוצב. {prefix} מוסיף את השם; את › והרווחים עורכים בכל הודעה.
#
# === עיצוב ===
# צבעים: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B וגם [RRGGBB]. ניתן להשתמש גם ב-MiniMessage לעיצוב מותאם.
#
# === משתנים ===
# יש לשמור על שמות המשתנים ולהשתמש רק במשתנים הקיימים בכל הודעה.
#   {after}  הערך החדש
#   {argument}  ארגומנט פקודה
#   {before}  הערך הקודם
#   {category}  קטגוריית פקודה
#   {command}  טקסט או שם הפקודה
#   {count}  מספר פריטים או תוצאות
#   {detail}  פרט תיאורי
#   {group}  Permission או שחקן
#   {id}  מזהה
#   {key}  מפתח הגדרה או הודעה
#   {label}  תווית תצוגה
#   {line}  מקור או קו מספר
#   {locale}  אזור השפה
#   {maximum}  ערך מותר מקסימלי
#   {name}  שם רשומה או שם תצוגה
#   {operation}  שם הפעולה
#   {parameter}  שם הפרמטר
#   {permission}  צומת הרשאה
#   {personal}  אזור השפה האישי
#   {player}  שם השחקן
#   {prefix}  runtime.prefix מכיל רק את השם המעוצב. {prefix} מוסיף את השם; את › והרווחים עורכים בכל הודעה.
#   {reason}  סיבה או פרטי שגיאה
#   {seconds}  משך בשניות
#   {setting}  שם ההגדרה
#   {target}  שחקן היעד, הישות או הערך
#   {title}  טקסט הכותרת
#   {type}  סוג הערך או הנתון
#   {value}  הערך הנוכחי או החדש
#   {variables}  מצייני מקום תקינים
#   {version}  גרסה
#   {world}  שם העולם

#   {section}  מקטע בעורך
#   {path}  נתיב הדוח המקומי
#   {url}  כתובת הדוח

#   {step}  גודל השינוי בכל לחיצה

