# קובץ השפה של Rift (עברית - ישראל).
# הקובץ יורד רק אם הוא חסר; יש לערוך ישירות את languages/he_IL.toml.
# שינויים מקומיים לעולם אינם מוחלפים אוטומטית; ערכים חסרים משתמשים באנגלית.
# אפשר לערוך את ההודעות שלמטה; שינויים שנשמרו מזוהים ומוחלים באופן אוטומטי.
# יש להשאיר כל מציין מקום בדיוק כפי שנכתב, כולל הסוגריים המסולסלים.
# יש להשתמש במציין מקום רק בהודעות שתבנית ברירת המחדל שלהן מגדירה אותו; מציינים שאינם נתמכים לא יוחלפו.
# קידומת: {prefix}=הערך הגלובלי runtime.prefix. הסירו את {prefix} מהודעה מסוימת כדי להסתיר אותה רק שם.
# מצייני מקום זמינים:
#
# {argument} - ארגומנט פקודה
# {category} - קטגוריית פקודה
# {command} - טקסט או שם הפקודה
# {count} - מספר פריטים או תוצאות
# {detail} - פרט תיאורי
# {id} - מזהה
# {key} - מפתח הגדרה או הודעה
# {label} - תווית תצוגה
# {locale} - אזור השפה
#   {personal}      אזור השפה האישי
# {name} - שם רשומה או שם תצוגה
# {operation} - שם הפעולה
# {parameter} - שם הפרמטר
# {permission} - צומת הרשאה
# {player} - שם השחקן
# {reason} - סיבה או פרטי שגיאה
# {seconds} - משך בשניות
# {setting} - שם ההגדרה
# {before} - הערך הקודם
# {after} - הערך החדש
# {title} - טקסט הכותרת
# {type} - סוג הערך או הנתון
# {usage} - טקסט השימוש בפקודה
# {value} - הערך הנוכחי או החדש
# {version} - גרסה
# {world} - שם העולם
#

