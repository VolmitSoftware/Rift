# Rift-kielitiedosto (Suomi - Suomi).
# Tämä tiedosto ladataan vain, jos se puuttuu; muokkaa tiedostoa languages/fi_FI.toml suoraan.
# Paikallisia muutoksia ei korvata automaattisesti; puuttuvat kohdat käyttävät englantia.
# Muokkaa alla olevia viestejä; tallennetut muutokset havaitaan ja otetaan käyttöön automaattisesti.
# Säilytä jokainen paikkamerkki täsmälleen kirjoitetussa muodossa aaltosulkeineen.
# Käytä paikkamerkkiä vain viesteissä, joiden oletusmalli määrittää sen; tukemattomia paikkamerkkejä ei korvata.
# Etuliite: {prefix}=yleinen runtime.prefix-arvo. Poista {prefix} yksittäisestä viestistä piilottaaksesi sen siinä.
# Käytettävissä olevat paikkamerkit:
#
# {argument} - komennon argumentti
# {category} - komentoluokka
# {command} - komennon teksti tai nimi
# {count} - kohteiden tai tulosten määrä
# {detail} - kuvaava lisätieto
# {id} - tunniste
# {key} - asetuksen tai viestin avain
# {label} - näyttönimike
# {locale} - kielen alueasetus
#   {personal}      henkilökohtainen kielitunnus
# {name} - merkinnän tai näytön nimi
# {operation} - toiminnon nimi
# {parameter} - parametrin nimi
# {permission} - käyttöoikeussolmu
# {player} - pelaajan nimi
# {reason} - syy tai virheen lisätieto
# {seconds} - kesto sekunteina
# {setting} - asetuksen nimi
# {before} - edellinen arvo
# {after} - uusi arvo
# {title} - otsikkoteksti
# {type} - arvon tai tiedon tyyppi
# {usage} - komennon käyttöteksti
# {value} - nykyinen tai uusi arvo
# {version} - versio
# {world} - maailman nimi
#

