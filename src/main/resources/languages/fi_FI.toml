# Rift — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/Rift/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /rift language server edit fi_FI
#
# === Etuliite ===
# runtime.prefix sisältää muotoillun lisäosan nimen, jonka {prefix} lisää.
# Erotin ja välilyönnit määritetään kussakin viestissä. Poista {prefix}&r &7› &7, jos haluat piilottaa koko chat-etuliitteen.
#
# === Muotoilu ===
# Värit ja tyylit: &0-&f, &k-&r.
# RGB-värit: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage tukee omia muotoiluja. Kirjoita kenoviiva merkin & tai [ eteen, jos haluat näyttää sen sellaisenaan.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {added}  Kielipäivityksen lisäämät viestit
#   {after}  uusi arvo
#   {argument}  komennon argumentti
#   {before}  edellinen arvo
#   {category}  luokka
#   {command}  komennon polku
#   {count}  merkintöjen määrä
#   {detail}  merkinnän lisätieto
#   {group}  viestiryhmä
#   {id}  karanteenitunnus
#   {kept}  Kielipäivityksessä säilytetyt paikalliset muokkaukset
#   {key}  parametrin tai viestin avain
#   {label}  näyttönimike
#   {line}  rivinumero
#   {locale}  kielikoodi
#   {maximum}  syötteen enimmäispituus
#   {name}  merkinnän nimi
#   {operation}  toiminnon nimi
#   {parameter}  parametrin nimi
#   {permission}  käyttöoikeussolmu
#   {personal}  pelaajan oma kieli, kun se poikkeaa palvelimen oletuksesta
#   {player}  pelaajan nimi
#   {prefix}  muotoiltu nimi kohdasta runtime.prefix; erotin ja välilyönnit kuuluvat kuhunkin viestiin
#   {reason}  syy tai virheen lisätieto
#   {remaining}  Aika seuraavaan sallittuun kielitarkistukseen
#   {seconds}  kesto sekunteina
#   {setting}  asetuksen nimi
#   {target}  valinnan kohde
#   {title}  osion otsikko
#   {type}  arvon tai tiedon tyyppi
#   {updated}  Kielipäivityksen muuttamat viestit
#   {value}  nykyinen tai uusi arvo
#   {variables}  sallitut paikkamerkit
#   {version}  lisäosan versio
#   {world}  maailman nimi

#   {section}  Editorin osio
#   {path}  Paikallisen raportin polku
#   {url}  Lähetetyn raportin URL-osoite

#   {step}  muutos napsautusta kohden

#   {limit}  maailmaan päästettävien pelaajien enimmäismäärä

