# Rift — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/Rift/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /rift language server edit fi_FI
#
# === Etuliite ===
# runtime.prefix sisältää vain muotoillun nimen. {prefix} lisää nimen; › ja välilyönnit muokataan viestissä.
#
# === Muotoilu ===
# Värit: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ja [RRGGBB]. MiniMessage toimii myös omissa muotoiluissa.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {after}  uusi arvo
#   {argument}  komennon argumentti
#   {before}  edellinen arvo
#   {category}  komentoluokka
#   {command}  komennon teksti tai nimi
#   {count}  kohteiden tai tulosten määrä
#   {detail}  kuvaava lisätieto
#   {group}  Lupa tai pelaajaryhmä
#   {id}  tunniste
#   {key}  asetuksen tai viestin avain
#   {label}  näyttönimike
#   {line}  Lähderivi tai viivanumero
#   {locale}  kielen alueasetus
#   {maximum}  Suurin sallittu arvo
#   {name}  merkinnän tai näytön nimi
#   {operation}  toiminnon nimi
#   {parameter}  parametrin nimi
#   {permission}  käyttöoikeussolmu
#   {personal}  henkilökohtainen kielitunnus
#   {player}  pelaajan nimi
#   {prefix}  runtime.prefix sisältää vain muotoillun nimen. {prefix} lisää nimen; › ja välilyönnit muokataan viestissä.
#   {reason}  syy tai virheen lisätieto
#   {seconds}  kesto sekunteina
#   {setting}  asetuksen nimi
#   {target}  Kohdepelaaja, yhteisö tai arvo
#   {title}  otsikkoteksti
#   {type}  arvon tai tiedon tyyppi
#   {value}  nykyinen tai uusi arvo
#   {variables}  sallitut paikkamerkit
#   {version}  versio
#   {world}  maailman nimi

#   {section}  Editorin osio
#   {path}  Paikallisen raportin polku
#   {url}  Raportin URL-osoite

