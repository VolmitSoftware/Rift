# Ficheiro de idioma do Rift (Português - Portugal).
# Este ficheiro é transferido apenas quando falta; edita diretamente languages/pt_PT.toml.
# As alterações locais nunca são substituídas automaticamente; as entradas ausentes usam inglês.
# Edite as mensagens abaixo; as alterações guardadas são detetadas e aplicadas automaticamente.
# Mantenha cada marcador exatamente como está escrito, incluindo as chavetas.
# Utilize um marcador apenas nas mensagens cujo modelo predefinido o declara; marcadores não suportados não são substituídos.
# Prefixo: {prefix}=o valor global runtime.prefix. Remove {prefix} de uma mensagem para o ocultar apenas aí.
# Marcadores disponíveis:
#
# {argument} - argumento do comando
# {category} - categoria do comando
# {command} - texto ou nome do comando
# {count} - quantidade de itens ou resultados
# {detail} - detalhe descritivo
# {id} - identificador
# {key} - chave de configuração ou mensagem
# {label} - etiqueta apresentada
# {locale} - região do idioma
#   {personal}      região pessoal
# {name} - nome da entrada ou de apresentação
# {operation} - nome da operação
# {parameter} - nome do parâmetro
# {permission} - nó de permissão
# {player} - nome do jogador
# {reason} - motivo ou detalhe do erro
# {seconds} - duração em segundos
# {setting} - nome da definição
# {before} - valor anterior
# {after} - valor novo
# {title} - texto do título
# {type} - tipo de valor ou dados
# {usage} - texto de utilização do comando
# {value} - valor atual ou novo
# {version} - versão
# {world} - nome do mundo
#

