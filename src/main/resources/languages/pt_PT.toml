# Rift — pt_PT
#
# === Editar o ficheiro ===
# plugins/Rift/languages/pt_PT.toml
# Pode editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta ou inválidas usam o inglês incorporado.
# /rift language server edit pt_PT
#
# === Prefixo ===
# runtime.prefix contém apenas o nome formatado. {prefix} insere o nome; › e os espaços editam-se em cada mensagem.
#
# === Formatação ===
# Cores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. O MiniMessage continua disponível para formatação personalizada.
#
# === Variáveis ===
# Mantenha os nomes das variáveis e use apenas as que pertencem a cada mensagem.
#   {after}  valor novo
#   {argument}  argumento do comando
#   {before}  valor anterior
#   {category}  categoria do comando
#   {command}  texto ou nome do comando
#   {count}  quantidade de itens ou resultados
#   {detail}  detalhe descritivo
#   {group}  Permissão ou grupo de jogadores
#   {id}  identificador
#   {key}  chave de configuração ou mensagem
#   {label}  etiqueta apresentada
#   {line}  Linha de origem ou número de linha
#   {locale}  região do idioma
#   {maximum}  Valor máximo autorizado
#   {name}  nome da entrada ou de apresentação
#   {operation}  nome da operação
#   {parameter}  nome do parâmetro
#   {permission}  nó de permissão
#   {personal}  região pessoal
#   {player}  nome do jogador
#   {prefix}  runtime.prefix contém apenas o nome formatado. {prefix} insere o nome; › e os espaços editam-se em cada mensagem.
#   {reason}  motivo ou detalhe do erro
#   {seconds}  duração em segundos
#   {setting}  nome da definição
#   {target}  Jogador alvo, entidade ou valor
#   {title}  texto do título
#   {type}  tipo de valor ou dados
#   {value}  valor atual ou novo
#   {variables}  marcadores válidos
#   {version}  versão
#   {world}  nome do mundo

#   {section}  Secção do editor
#   {path}  Caminho do relatório local
#   {url}  URL do relatório

