# Rift — zh_CN
#
# === 编辑文件 ===
# plugins/Rift/languages/zh_CN.toml
# 可直接编辑此文件。本地修改会保留；缺失或无效条目使用内置英语文本。
# /rift language server edit zh_CN
#
# === 前缀 ===
# runtime.prefix 仅包含带格式的名称。{prefix} 插入名称；› 和空格在每条消息中单独编辑。
#
# === 格式 ===
# 颜色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自定义格式仍可使用 MiniMessage。
#
# === 变量 ===
# 请勿更改变量名，仅使用各消息中原有的变量。
#   {after}  更改后的值
#   {argument}  命令参数
#   {before}  更改前的值
#   {category}  命令类别
#   {command}  命令文本或名称
#   {count}  项目或结果数量
#   {detail}  描述详情
#   {group}  权限或玩家组
#   {id}  标识符
#   {key}  配置键或消息键
#   {label}  显示标签
#   {line}  源行或行号
#   {locale}  语言区域
#   {maximum}  允许的最大值
#   {name}  条目名称或显示名称
#   {operation}  操作名称
#   {parameter}  参数名称
#   {permission}  权限节点
#   {personal}  个人区域设置
#   {player}  玩家名称
#   {prefix}  runtime.prefix 仅包含带格式的名称。{prefix} 插入名称；› 和空格在每条消息中单独编辑。
#   {reason}  原因或错误详情
#   {seconds}  持续秒数
#   {setting}  设置名称
#   {target}  目标玩家、实体或值
#   {title}  标题文本
#   {type}  值或数据类型
#   {value}  当前值或新值
#   {variables}  可用占位符
#   {version}  版本
#   {world}  世界名称

#   {section}  编辑器分区
#   {path}  本地报告路径
#   {url}  报告网址

