# Rift — zh_CN
#
# === 编辑文件 ===
# plugins/Rift/languages/zh_CN.toml
# 可直接编辑此文件。本地修改会保留；缺失或无效条目使用内置英语文本。
# /rift language server edit zh_CN
#
# === 前缀 ===
# runtime.prefix 存储 {prefix} 使用的带格式插件名称。分隔符和空格由各条消息提供。删除 {prefix}&r &7› &7 即可隐藏完整的聊天前缀。
#
# === 格式 ===
# 颜色和样式：&0-&f、&k-&r。RGB 颜色：&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。MiniMessage 支持自定义格式。在 & 或 [ 前加反斜杠可按原样显示。
#
# === 变量 ===
# 请勿更改变量名，仅使用各消息中原有的变量。
#   {added}  语言更新中新增的消息数
#   {after}  新值
#   {argument}  命令参数
#   {before}  原值
#   {category}  分类
#   {command}  命令路径
#   {count}  条目数量
#   {detail}  条目详情
#   {group}  消息分组
#   {id}  隔离 ID
#   {kept}  语言更新中保留的本地修改数
#   {key}  参数键或消息键
#   {label}  显示标签
#   {line}  行号
#   {locale}  语言代码
#   {maximum}  最大输入长度
#   {name}  条目名称
#   {operation}  操作
#   {parameter}  参数
#   {permission}  权限
#   {personal}  与服务器默认语言不同时，玩家的个人语言
#   {player}  玩家
#   {prefix}  runtime.prefix 中的带格式名称；分隔符和空格由各条消息提供
#   {reason}  失败详情
#   {remaining}  距下次允许检查语言的剩余时间
#   {seconds}  时长
#   {setting}  设置
#   {target}  选择目标
#   {title}  分区标题
#   {type}  值类型
#   {updated}  语言更新中更改的消息数
#   {value}  当前值或新值
#   {variables}  可用占位符
#   {version}  插件版本
#   {world}  世界

#   {section}  编辑器分区
#   {path}  本地报告路径
#   {url}  已上传报告的网址

#   {step}  每次点击的调整量

#   {limit}  世界允许进入的最大玩家人数

