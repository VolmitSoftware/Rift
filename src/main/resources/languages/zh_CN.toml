# Rift 语言文件（简体中文 - 中国）。
# 此文件仅在缺失时下载；请直接编辑 languages/zh_CN.toml。
# 本地更改绝不会被自动替换；缺少的项目使用英文。
# 可编辑下方消息；保存的更改会被自动检测并应用。
# 请将每个占位符（包括花括号）保持原样。
# 占位符只能用于默认模板已声明该占位符的消息；不受支持的占位符不会被替换。
# 前缀：{prefix}=全局 runtime.prefix 值。从某条消息中删除 {prefix}，即可只在该消息中隐藏前缀。
# 可用占位符：
#
# {argument} - 命令参数
# {category} - 命令类别
# {command} - 命令文本或名称
# {count} - 项目或结果数量
# {detail} - 描述详情
# {id} - 标识符
# {key} - 配置键或消息键
# {label} - 显示标签
# {locale} - 语言区域
#   {personal}      个人区域设置
# {name} - 条目名称或显示名称
# {operation} - 操作名称
# {parameter} - 参数名称
# {permission} - 权限节点
# {player} - 玩家名称
# {reason} - 原因或错误详情
# {seconds} - 持续秒数
# {setting} - 设置名称
# {before} - 更改前的值
# {after} - 更改后的值
# {title} - 标题文本
# {type} - 值或数据类型
# {usage} - 命令用法文本
# {value} - 当前值或新值
# {version} - 版本
# {world} - 世界名称
#

