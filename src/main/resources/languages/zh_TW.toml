# Rift — zh_TW
#
# === 編輯檔案 ===
# plugins/Rift/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /rift language server edit zh_TW
#
# === 前綴 ===
# runtime.prefix 儲存 {prefix} 使用的帶格式外掛程式名稱。分隔符號和空格由各則訊息提供。刪除 {prefix}&r &7› &7 即可隱藏完整的聊天前綴。
#
# === 格式 ===
# 顏色和樣式：&0-&f、&k-&r。RGB 顏色：&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。MiniMessage 支援自訂格式。在 & 或 [ 前加上反斜線即可照原樣顯示。
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各訊息中原有的變數。
#   {added}  語言更新中新增的訊息數
#   {after}  新值
#   {argument}  指令引數
#   {before}  原值
#   {category}  類別
#   {command}  指令路徑
#   {count}  項目數量
#   {detail}  項目詳情
#   {group}  訊息群組
#   {id}  隔離 ID
#   {kept}  語言更新中保留的本機修改數
#   {key}  參數鍵或訊息鍵
#   {label}  顯示標籤
#   {line}  行號
#   {locale}  語言代碼
#   {maximum}  最大輸入長度
#   {name}  項目名稱
#   {operation}  操作
#   {parameter}  參數
#   {permission}  權限
#   {personal}  與伺服器預設語言不同時，玩家的個人語言
#   {player}  玩家
#   {prefix}  runtime.prefix 中的帶格式名稱；分隔符號和空格由各則訊息提供
#   {reason}  失敗詳情
#   {remaining}  距下次允許檢查語言的剩餘時間
#   {seconds}  持續時間
#   {setting}  設定
#   {target}  選取目標
#   {title}  區段標題
#   {type}  值型別
#   {updated}  語言更新中變更的訊息數
#   {value}  目前值或新值
#   {variables}  可用佔位符
#   {version}  外掛程式版本
#   {world}  世界

#   {section}  編輯器區段
#   {path}  本機報告路徑
#   {url}  已上傳報告的網址

#   {step}  每次點擊的調整量

#   {limit}  世界允許進入的最大玩家人數

