# Rift 語言檔案（繁體中文 - 台灣）。
# 此檔案僅在缺少時下載；請直接編輯 languages/zh_TW.toml。
# 本機變更絕不會被自動取代；缺少的項目使用英文。
# 可編輯下方訊息；儲存的變更會被自動偵測並套用。
# 請將每個預留位置（包括大括號）保持原樣。
# 預留位置只能用於預設範本已宣告該預留位置的訊息；不支援的預留位置不會被替換。
# 前綴：{prefix}=全域 runtime.prefix 值。從個別訊息中移除 {prefix}，即可只在該處隱藏前綴。
# 可用預留位置：
#
# {argument} - 指令引數
# {category} - 指令類別
# {command} - 指令文字或名稱
# {count} - 項目或結果數量
# {detail} - 描述詳情
# {id} - 識別碼
# {key} - 設定鍵或訊息鍵
# {label} - 顯示標籤
# {locale} - 語言地區
#   {personal}      個人地區設定
# {name} - 項目名稱或顯示名稱
# {operation} - 操作名稱
# {parameter} - 參數名稱
# {permission} - 權限節點
# {player} - 玩家名稱
# {reason} - 原因或錯誤詳情
# {seconds} - 持續秒數
# {setting} - 設定名稱
# {before} - 變更前的值
# {after} - 變更後的值
# {title} - 標題文字
# {type} - 值或資料類型
# {usage} - 指令用法文字
# {value} - 目前值或新值
# {version} - 版本
# {world} - 世界名稱
#

