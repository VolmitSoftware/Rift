# Rift — zh_TW
#
# === 編輯檔案 ===
# plugins/Rift/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /rift language server edit zh_TW
#
# === 前綴 ===
# 前綴：{prefix}=全域 runtime.prefix 值。從個別訊息中移除 {prefix}，即可只在該處隱藏前綴。
#
# === 格式 ===
# 顏色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自訂格式仍可使用 MiniMessage。
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各訊息中原有的變數。
#   {after}  變更後的值
#   {argument}  指令引數
#   {before}  變更前的值
#   {category}  指令類別
#   {command}  指令文字或名稱
#   {count}  項目或結果數量
#   {detail}  描述詳情
#   {group}  權限或玩家群組
#   {id}  識別碼
#   {key}  設定鍵或訊息鍵
#   {label}  顯示標籤
#   {line}  來源行或行號
#   {locale}  語言地區
#   {maximum}  最大允許值
#   {name}  項目名稱或顯示名稱
#   {operation}  操作名稱
#   {parameter}  參數名稱
#   {permission}  權限節點
#   {personal}  個人地區設定
#   {player}  玩家名稱
#   {plugin}  插件名稱
#   {prefix}  全域 runtime.prefix 值。從個別訊息中移除 {prefix}，即可只在該處隱藏前綴。
#   {reason}  原因或錯誤詳情
#   {seconds}  持續秒數
#   {setting}  設定名稱
#   {target}  目標播放器、 實體或值
#   {title}  標題文字
#   {type}  值或資料類型
#   {usage}  指令用法文字
#   {value}  目前值或新值
#   {variables}  可用佔位符
#   {version}  版本
#   {world}  世界名稱

