# Tệp ngôn ngữ Rift (Tiếng Việt - Việt Nam).
# Tệp này chỉ được tải xuống khi chưa tồn tại; hãy sửa trực tiếp languages/vi_VI.toml.
# Thay đổi cục bộ không bao giờ bị tự động thay thế; mục còn thiếu dùng tiếng Anh.
# Chỉnh sửa các thông báo bên dưới; thay đổi đã lưu sẽ được tự động phát hiện và áp dụng.
# Giữ nguyên từng phần giữ chỗ đúng như cách viết, bao gồm cả dấu ngoặc nhọn.
# Chỉ dùng phần giữ chỗ trong thông báo có mẫu mặc định khai báo phần đó; phần giữ chỗ không được hỗ trợ sẽ không được thay thế.
# Tiền tố: {prefix}=giá trị runtime.prefix toàn cục. Xóa {prefix} khỏi từng thông báo nếu không muốn hiện ở thông báo đó.
# Các phần giữ chỗ có sẵn:
#
# {argument} - đối số lệnh
# {category} - danh mục lệnh
# {command} - văn bản hoặc tên lệnh
# {count} - số lượng mục hoặc kết quả
# {detail} - chi tiết mô tả
# {id} - mã định danh
# {key} - khóa cấu hình hoặc thông báo
# {label} - nhãn hiển thị
# {locale} - thiết lập vùng ngôn ngữ
#   {personal}      mã vùng cá nhân
# {name} - tên mục hoặc tên hiển thị
# {operation} - tên thao tác
# {parameter} - tên tham số
# {permission} - nút quyền hạn
# {player} - tên người chơi
# {reason} - lý do hoặc chi tiết lỗi
# {seconds} - thời lượng tính bằng giây
# {setting} - tên cài đặt
# {before} - giá trị trước đó
# {after} - giá trị mới
# {title} - văn bản tiêu đề
# {type} - kiểu giá trị hoặc dữ liệu
# {usage} - văn bản cách dùng lệnh
# {value} - giá trị hiện tại hoặc mới
# {version} - phiên bản
# {world} - tên thế giới
#

