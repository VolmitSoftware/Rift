# Rift — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/Rift/languages/vi_VI.toml
# Bạn có thể chỉnh sửa trực tiếp tệp này. Thay đổi cục bộ được giữ lại; mục thiếu hoặc không hợp lệ dùng bản tiếng Anh tích hợp.
# /rift language server edit vi_VI
#
# === Tiền tố ===
# Tiền tố: {prefix}=giá trị runtime.prefix toàn cục. Xóa {prefix} khỏi từng thông báo nếu không muốn hiện ở thông báo đó.
#
# === Định dạng ===
# Màu: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B và [RRGGBB]. MiniMessage vẫn dùng được cho định dạng tùy chỉnh.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến có sẵn trong từng thông báo.
#   {after}  giá trị mới
#   {argument}  đối số lệnh
#   {before}  giá trị trước đó
#   {category}  danh mục lệnh
#   {command}  văn bản hoặc tên lệnh
#   {count}  số lượng mục hoặc kết quả
#   {detail}  chi tiết mô tả
#   {group}  Cho phép hay nhóm người chơi
#   {id}  mã định danh
#   {key}  khóa cấu hình hoặc thông báo
#   {label}  nhãn hiển thị
#   {line}  Số dòng hay dòng nguồn
#   {locale}  thiết lập vùng ngôn ngữ
#   {maximum}  Giá trị được chấp nhận tối đa
#   {name}  tên mục hoặc tên hiển thị
#   {operation}  tên thao tác
#   {parameter}  tên tham số
#   {permission}  nút quyền hạn
#   {personal}  mã vùng cá nhân
#   {player}  tên người chơi
#   {plugin}  Tên phần bổ sung
#   {prefix}  giá trị runtime.prefix toàn cục. Xóa {prefix} khỏi từng thông báo nếu không muốn hiện ở thông báo đó.
#   {reason}  lý do hoặc chi tiết lỗi
#   {seconds}  thời lượng tính bằng giây
#   {setting}  tên cài đặt
#   {target}  Người chơi đích, thực thể hay giá trị
#   {title}  văn bản tiêu đề
#   {type}  kiểu giá trị hoặc dữ liệu
#   {usage}  văn bản cách dùng lệnh
#   {value}  giá trị hiện tại hoặc mới
#   {variables}  chỗ giữ chỗ hợp lệ
#   {version}  phiên bản
#   {world}  tên thế giới

