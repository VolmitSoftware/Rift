# Rift — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/Rift/languages/vi_VI.toml
# Bạn có thể chỉnh sửa trực tiếp tệp này. Thay đổi cục bộ được giữ lại; mục thiếu hoặc không hợp lệ dùng bản tiếng Anh tích hợp.
# /rift language server edit vi_VI
#
# === Tiền tố ===
# runtime.prefix chỉ lưu tên plugin đã định dạng mà {prefix} chèn vào. Dấu phân cách và khoảng trắng do từng thông báo tự cung cấp. Xóa {prefix}&r &7› &7 để ẩn toàn bộ tiền tố trò chuyện.
#
# === Định dạng ===
# Màu: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B và [RRGGBB]. MiniMessage vẫn dùng được cho định dạng tùy chỉnh. Đặt dấu gạch chéo ngược trước & hoặc [ để hiển thị nguyên ký tự đó.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến thuộc về từng thông báo.
#   {added}  số thông báo được thêm bởi bản cập nhật ngôn ngữ
#   {after}  giá trị mới
#   {argument}  đối số
#   {before}  giá trị trước đó
#   {category}  danh mục
#   {command}  đường dẫn lệnh
#   {count}  số mục
#   {detail}  chi tiết mục
#   {group}  nhóm thông báo
#   {id}  ID cách ly
#   {kept}  số chỉnh sửa cục bộ được giữ lại sau bản cập nhật ngôn ngữ
#   {key}  khóa tham số
#   {label}  nhãn hiển thị
#   {line}  số dòng
#   {locale}  mã ngôn ngữ
#   {maximum}  độ dài nhập tối đa
#   {name}  tên mục
#   {operation}  thao tác
#   {parameter}  tham số
#   {permission}  quyền
#   {personal}  mã ngôn ngữ cá nhân của người chơi khi khác với mặc định của máy chủ
#   {player}  người chơi
#   {prefix}  tên đã định dạng từ runtime.prefix; dấu phân cách và khoảng trắng thuộc về từng thông báo
#   {reason}  chi tiết lỗi
#   {remaining}  thời gian còn lại đến lần kiểm tra ngôn ngữ tiếp theo
#   {seconds}  thời lượng tính bằng giây
#   {setting}  thiết lập
#   {target}  đối tượng được chọn
#   {title}  tiêu đề mục
#   {type}  kiểu giá trị
#   {updated}  số thông báo được thay đổi bởi bản cập nhật ngôn ngữ
#   {value}  giá trị hiện tại hoặc mới
#   {variables}  các biến được phép dùng
#   {version}  phiên bản plugin
#   {world}  thế giới

#   {section}  mục trong trình chỉnh sửa
#   {path}  đường dẫn báo cáo cục bộ
#   {url}  URL báo cáo đã tải lên

#   {step}  mức thay đổi mỗi lần nhấp

#   {limit}  số người chơi tối đa được vào một thế giới

