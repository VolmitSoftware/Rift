# Rift — ja-JP
#
# === ファイルの編集 ===
# plugins/Rift/languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /rift language server edit ja-JP
#
# === 接頭辞 ===
# 接頭辞: {prefix}=グローバルな runtime.prefix の値です。個別のメッセージから {prefix} を削除すると、その場所だけ非表示になります。
#
# === 書式 ===
# 色: &0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。独自書式には MiniMessage も使用できます。
#
# === 変数 ===
# 変数名を変更せず、各メッセージに元からある変数だけを使用してください。
#   {after}  変更後の値
#   {argument}  コマンド引数
#   {before}  変更前の値
#   {category}  コマンドのカテゴリ
#   {command}  コマンドの文字列または名前
#   {count}  項目または結果の件数
#   {detail}  説明の詳細
#   {group}  許可またはプレイヤーグループ
#   {id}  識別子
#   {key}  設定またはメッセージのキー
#   {label}  表示ラベル
#   {line}  ラインまたはライン番号
#   {locale}  言語ロケール
#   {maximum}  最大許容値
#   {name}  項目名または表示名
#   {operation}  操作名
#   {parameter}  パラメーター名
#   {permission}  権限ノード
#   {personal}  個人設定のロケール
#   {player}  プレイヤー名
#   {plugin}  プラグイン名
#   {prefix}  グローバルな runtime.prefix の値です。個別のメッセージから {prefix} を削除すると、その場所だけ非表示になります。
#   {reason}  理由またはエラーの詳細
#   {seconds}  秒単位の時間
#   {setting}  設定名
#   {target}  ターゲットプレーヤー、エンティティティティ、または値
#   {title}  タイトル文字列
#   {type}  値またはデータの型
#   {usage}  コマンドの使用法
#   {value}  現在または新しい値
#   {variables}  使用可能なプレースホルダー
#   {version}  バージョン
#   {world}  ワールド名

