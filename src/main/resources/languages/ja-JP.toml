# Rift — ja-JP
#
# === ファイルの編集 ===
# plugins/Rift/languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /rift language server edit ja-JP
#
# === 接頭辞 ===
# runtime.prefix には書式付きのプラグイン名だけを保存し、{prefix} でその名前を挿入します。区切り記号と空白は各メッセージ側で指定します。{prefix}&r &7› &7 を削除すると、チャットの接頭辞全体が非表示になります。
#
# === 書式 ===
# 色: &0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。独自の書式には MiniMessage も使用できます。& や [ をそのまま表示するには、前にバックスラッシュを付けてください。
#
# === 変数 ===
# 変数名は変更せず、各メッセージに属する変数だけを使用してください。
#   {added}  言語更新で追加されたメッセージ
#   {after}  変更後の値
#   {argument}  引数
#   {before}  変更前の値
#   {category}  カテゴリ
#   {command}  コマンドのパス
#   {count}  項目数
#   {detail}  項目の詳細
#   {group}  メッセージグループ
#   {id}  隔離 ID
#   {kept}  言語更新で保持されたローカル編集
#   {key}  パラメーターのキー
#   {label}  表示ラベル
#   {line}  行番号
#   {locale}  ロケール
#   {maximum}  入力できる最大文字数
#   {name}  項目名
#   {operation}  操作
#   {parameter}  パラメーター
#   {permission}  権限
#   {personal}  サーバーのデフォルトと異なる場合の、プレイヤー個人のロケール
#   {player}  プレイヤー
#   {prefix}  runtime.prefix の書式付きの名前。区切り記号と空白は各メッセージ側で指定します
#   {reason}  失敗の詳細
#   {remaining}  次回の言語確認が可能になるまでの時間
#   {seconds}  秒数
#   {setting}  設定
#   {target}  選択の対象
#   {title}  セクションのタイトル
#   {type}  値の型
#   {updated}  言語更新で変更されたメッセージ
#   {value}  現在または新しい値
#   {variables}  使用可能なプレースホルダー
#   {version}  プラグインのバージョン
#   {world}  ワールド

#   {section}  エディターのセクション
#   {path}  ローカルレポートのパス
#   {url}  アップロードしたレポートの URL

#   {step}  クリックごとの増減量

#   {limit}  ワールドに入場できる最大プレイヤー数

