# Rift 言語ファイル（日本語 - 日本）。
# このファイルは存在しない場合にのみダウンロードされます。languages/ja-JP.toml を直接編集してください。
# ローカルの変更は自動的に上書きされません。未指定の項目は英語で補完されます。
# 以下のメッセージを編集できます。保存した変更は自動的に検出され、適用されます。
# 各プレースホルダーは波括弧を含め、記載どおりに残してください。
# プレースホルダーは、既定テンプレートで宣言されているメッセージでのみ使用してください。未対応のプレースホルダーは置換されません。
# 接頭辞: {prefix}=グローバルな runtime.prefix の値です。個別のメッセージから {prefix} を削除すると、その場所だけ非表示になります。
# 使用可能なプレースホルダー：
#
# {argument} - コマンド引数
# {category} - コマンドのカテゴリ
# {command} - コマンドの文字列または名前
# {count} - 項目または結果の件数
# {detail} - 説明の詳細
# {id} - 識別子
# {key} - 設定またはメッセージのキー
# {label} - 表示ラベル
# {locale} - 言語ロケール
#   {personal}      個人設定のロケール
# {name} - 項目名または表示名
# {operation} - 操作名
# {parameter} - パラメーター名
# {permission} - 権限ノード
# {player} - プレイヤー名
# {reason} - 理由またはエラーの詳細
# {seconds} - 秒単位の時間
# {setting} - 設定名
# {before} - 変更前の値
# {after} - 変更後の値
# {title} - タイトル文字列
# {type} - 値またはデータの型
# {usage} - コマンドの使用法
# {value} - 現在または新しい値
# {version} - バージョン
# {world} - ワールド名
#

