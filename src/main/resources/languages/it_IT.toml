# Rift — it_IT
#
# === Modifica del file ===
# plugins/Rift/languages/it_IT.toml
# Puoi modificare direttamente questo file. Le modifiche locali vengono conservate; le voci mancanti o non valide usano l’inglese incorporato.
# /rift language server edit it_IT
#
# === Prefisso ===
# runtime.prefix contiene solo il nome formattato. {prefix} inserisce il nome; › e gli spazi si modificano nel singolo messaggio.
#
# === Formattazione ===
# Colori: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. MiniMessage resta disponibile per formati personalizzati.
#
# === Variabili ===
# Mantieni i nomi delle variabili e usa solo quelle previste dal singolo messaggio.
#   {added}  messaggi aggiunti da un aggiornamento della lingua
#   {after}  valore nuovo
#   {argument}  argomento del comando
#   {before}  valore precedente
#   {category}  categoria
#   {command}  percorso del comando
#   {count}  numero di voci
#   {detail}  dettaglio della voce
#   {group}  gruppo di messaggi
#   {id}  ID di quarantena
#   {kept}  modifiche locali conservate da un aggiornamento della lingua
#   {key}  chiave del parametro o del messaggio
#   {label}  etichetta visualizzata
#   {line}  numero di riga
#   {locale}  codice della lingua
#   {maximum}  lunghezza massima del testo inserito
#   {name}  nome della voce
#   {operation}  nome dell'operazione
#   {parameter}  nome del parametro
#   {permission}  nodo di permesso
#   {personal}  lingua personale di un giocatore quando è diversa da quella predefinita del server
#   {player}  nome del giocatore
#   {prefix}  nome formattato di runtime.prefix; separatori e spazi appartengono a ogni messaggio
#   {reason}  dettaglio dell'errore
#   {remaining}  tempo rimanente prima del prossimo controllo delle lingue
#   {seconds}  durata in secondi
#   {setting}  nome dell'impostazione
#   {target}  destinazione della selezione
#   {title}  titolo della sezione
#   {type}  tipo di valore
#   {updated}  messaggi modificati da un aggiornamento della lingua
#   {value}  valore attuale o nuovo
#   {variables}  segnaposto validi
#   {version}  versione
#   {world}  nome del mondo

#   {section}  sezione dell’editor
#   {path}  percorso del rapporto locale
#   {url}  URL del rapporto caricato

#   {step}  variazione numerica per clic

#   {limit}  numero massimo di giocatori ammessi in un mondo

