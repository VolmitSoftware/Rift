# Rift — it_IT
#
# === Modifica del file ===
# plugins/Rift/languages/it_IT.toml
# Puoi modificare direttamente questo file. Le modifiche locali vengono conservate; le voci mancanti o non valide usano l’inglese incorporato.
# /rift language server edit it_IT
#
# === Prefisso ===
# Prefisso: {prefix}=il valore globale runtime.prefix. Rimuovi {prefix} da un singolo messaggio per nasconderlo solo lì.
#
# === Formattazione ===
# Colori: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. MiniMessage resta disponibile per formati personalizzati.
#
# === Variabili ===
# Mantieni i nomi delle variabili e usa solo quelle previste dal singolo messaggio.
#   {after}  valore nuovo
#   {argument}  argomento del comando
#   {before}  valore precedente
#   {category}  categoria del comando
#   {command}  testo o nome del comando
#   {count}  numero di elementi o risultati
#   {detail}  dettaglio descrittivo
#   {group}  Permesso o gruppo di giocatori
#   {id}  identificatore
#   {key}  chiave di configurazione o messaggio
#   {label}  etichetta visualizzata
#   {line}  Linea di origine o numero di linea
#   {locale}  impostazione locale della lingua
#   {maximum}  Valore massimo consentito
#   {name}  nome della voce o visualizzato
#   {operation}  nome dell'operazione
#   {parameter}  nome del parametro
#   {permission}  nodo di permesso
#   {personal}  codice locale personale
#   {player}  nome del giocatore
#   {plugin}  Nome del plugin
#   {prefix}  il valore globale runtime.prefix. Rimuovi {prefix} da un singolo messaggio per nasconderlo solo lì.
#   {reason}  motivo o dettaglio dell'errore
#   {seconds}  durata in secondi
#   {setting}  nome dell'impostazione
#   {target}  Giocatore di destinazione, entità o valore
#   {title}  testo del titolo
#   {type}  tipo di valore o dato
#   {usage}  testo di utilizzo del comando
#   {value}  valore attuale o nuovo
#   {variables}  segnaposto validi
#   {version}  versione
#   {world}  nome del mondo

