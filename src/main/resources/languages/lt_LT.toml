# Rift — lt_LT
#
# === Failo redagavimas ===
# plugins/Rift/languages/lt_LT.toml
# Šį failą galima redaguoti tiesiogiai. Vietiniai pakeitimai išsaugomi; trūkstamiems ar netinkamiems įrašams naudojama integruota anglų kalba.
# /rift language server edit lt_LT
#
# === Priešdėlis ===
# Priešdėlis: {prefix}=visuotinė runtime.prefix reikšmė. Pašalinkite {prefix} iš atskiro pranešimo, kad jame jo nerodytų.
#
# === Formatavimas ===
# Spalvos: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ir [RRGGBB]. Pasirinktiniam formatavimui galima naudoti MiniMessage.
#
# === Kintamieji ===
# Nekeiskite kintamųjų pavadinimų ir naudokite tik konkrečiame pranešime esančius kintamuosius.
#   {after}  nauja reikšmė
#   {argument}  komandos argumentas
#   {before}  ankstesnė reikšmė
#   {category}  komandų kategorija
#   {command}  komandos tekstas arba pavadinimas
#   {count}  elementų arba rezultatų skaičius
#   {detail}  aprašomoji informacija
#   {group}  Leidimas arba žaidėjo grupė
#   {id}  identifikatorius
#   {key}  konfigūracijos arba pranešimo raktas
#   {label}  rodoma etiketė
#   {line}  Pradinės eilutės arba eilutės numeris
#   {locale}  kalbos lokalė
#   {maximum}  Didžiausia leidžiama vertė
#   {name}  įrašo arba rodomas pavadinimas
#   {operation}  operacijos pavadinimas
#   {parameter}  parametro pavadinimas
#   {permission}  leidimo mazgas
#   {personal}  asmeninė lokalė
#   {player}  žaidėjo vardas
#   {plugin}  Įskiepio pavadinimas
#   {prefix}  visuotinė runtime.prefix reikšmė. Pašalinkite {prefix} iš atskiro pranešimo, kad jame jo nerodytų.
#   {reason}  priežastis arba klaidos informacija
#   {seconds}  trukmė sekundėmis
#   {setting}  nustatymo pavadinimas
#   {target}  Tikslinis žaidėjas, subjektas arba vertė
#   {title}  antraštės tekstas
#   {type}  reikšmės arba duomenų tipas
#   {usage}  komandos naudojimo tekstas
#   {value}  dabartinė arba nauja reikšmė
#   {variables}  galimi vietos žymekliai
#   {version}  versija
#   {world}  pasaulio pavadinimas

