# Rift — nl_NL
#
# === Bestand bewerken ===
# plugins/Rift/languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; ontbrekende of ongeldige vermeldingen gebruiken het ingebouwde Engels.
# /rift language server edit nl_NL
#
# === Voorvoegsel ===
# runtime.prefix bevat de opgemaakte pluginnaam die {prefix} invoegt.
# Scheidingsteken en spaties staan in elk bericht zelf. Verwijder {prefix}&r &7› &7 om het volledige chatvoorvoegsel te verbergen.
#
# === Opmaak ===
# Kleuren en stijlen: &0-&f, &k-&r.
# RGB-kleuren: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage ondersteunt eigen opmaak. Zet een backslash voor & of [ om het teken letterlijk te tonen.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {added}  Berichten toegevoegd door een taalupdate
#   {after}  nieuwe waarde
#   {argument}  opdrachtargument
#   {before}  vorige waarde
#   {category}  categorie
#   {command}  opdrachtpad
#   {count}  aantal items
#   {detail}  itemdetail
#   {group}  berichtengroep
#   {id}  quarantaine-ID
#   {kept}  Lokale bewerkingen behouden door een taalupdate
#   {key}  parameter- of berichtsleutel
#   {label}  weergavelabel
#   {line}  regelnummer
#   {locale}  taalcode
#   {maximum}  maximale invoerlengte
#   {name}  itemnaam
#   {operation}  naam van de bewerking
#   {parameter}  parameternaam
#   {permission}  permissieknooppunt
#   {personal}  persoonlijke taal van een speler als die afwijkt van de serverstandaard
#   {player}  spelersnaam
#   {prefix}  de opgemaakte naam uit runtime.prefix; scheidingsteken en spaties staan in elk bericht zelf
#   {reason}  reden of foutdetail
#   {remaining}  Resterende tijd tot de volgende taalcontrole
#   {seconds}  duur in seconden
#   {setting}  naam van de instelling
#   {target}  selectiedoel
#   {title}  sectietitel
#   {type}  waarde- of gegevenstype
#   {updated}  Berichten gewijzigd door een taalupdate
#   {value}  huidige of nieuwe waarde
#   {variables}  geldige tijdelijke aanduidingen
#   {version}  pluginversie
#   {world}  wereldnaam

#   {section}  Sectie van de editor
#   {path}  Lokaal rapportpad
#   {url}  URL van het geüploade rapport

#   {step}  wijziging per klik

#   {limit}  maximumaantal spelers in een wereld

