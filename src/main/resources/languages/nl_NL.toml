# Rift-taalbestand (Nederlands - Nederland).
# Dit bestand wordt alleen gedownload als het ontbreekt; bewerk languages/nl_NL.toml rechtstreeks.
# Lokale wijzigingen worden nooit automatisch vervangen; ontbrekende waarden gebruiken Engels.
# Bewerk de onderstaande berichten; opgeslagen wijzigingen worden automatisch gedetecteerd en toegepast.
# Behoud elke tijdelijke aanduiding exact zoals geschreven, inclusief de accolades.
# Gebruik een tijdelijke aanduiding alleen in berichten waarvan de standaardsjabloon deze declareert; niet-ondersteunde aanduidingen worden niet vervangen.
# Voorvoegsel: {prefix}=de globale waarde runtime.prefix. Verwijder {prefix} uit één bericht om het alleen daar te verbergen.
# Beschikbare tijdelijke aanduidingen:
#
# {argument} - opdrachtargument
# {category} - opdrachtcategorie
# {command} - opdrachttekst of -naam
# {count} - aantal items of resultaten
# {detail} - beschrijvend detail
# {id} - identificatie
# {key} - configuratie- of berichtsleutel
# {label} - weergavelabel
# {locale} - taalregio
#   {personal}      persoonlijke landinstelling
# {name} - item- of weergavenaam
# {operation} - naam van de bewerking
# {parameter} - parameternaam
# {permission} - permissieknooppunt
# {player} - spelersnaam
# {reason} - reden of foutdetail
# {seconds} - duur in seconden
# {setting} - naam van de instelling
# {before} - vorige waarde
# {after} - nieuwe waarde
# {title} - titeltekst
# {type} - waarde- of gegevenstype
# {usage} - tekst voor opdrachtgebruik
# {value} - huidige of nieuwe waarde
# {version} - versie
# {world} - wereldnaam
#

[runtime]
prefix = "&5&lRIFT&r &8›&r "

