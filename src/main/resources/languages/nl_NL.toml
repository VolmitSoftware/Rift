list = "Lijst geladen, beheerd, ontdekt en in quarantaine gehouden werelden"
info = "Gedetailleerde staat voor één wereld tonen"
generators = "Al door beheerde werelden gebruikte generator-id's tonen"
config = "Open de in-game Rift configuratie-editor"
