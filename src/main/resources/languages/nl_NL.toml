# Rift — nl_NL
#
# === Bestand bewerken ===
# plugins/Rift/languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; ontbrekende of ongeldige vermeldingen gebruiken het ingebouwde Engels.
# /rift language server edit nl_NL
#
# === Voorvoegsel ===
# runtime.prefix bevat alleen de opgemaakte naam. {prefix} voegt de naam in; › en spaties staan in elk bericht.
#
# === Opmaak ===
# Kleuren: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B en [RRGGBB]. MiniMessage blijft beschikbaar voor eigen opmaak.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {after}  nieuwe waarde
#   {argument}  opdrachtargument
#   {before}  vorige waarde
#   {category}  opdrachtcategorie
#   {command}  opdrachttekst of -naam
#   {count}  aantal items of resultaten
#   {detail}  beschrijvend detail
#   {group}  Toestemming of spelersgroep
#   {id}  identificatie
#   {key}  configuratie- of berichtsleutel
#   {label}  weergavelabel
#   {line}  Bronregel of regelnummer
#   {locale}  taalregio
#   {maximum}  Maximaal toegestane waarde
#   {name}  item- of weergavenaam
#   {operation}  naam van de bewerking
#   {parameter}  parameternaam
#   {permission}  permissieknooppunt
#   {personal}  persoonlijke landinstelling
#   {player}  spelersnaam
#   {prefix}  runtime.prefix bevat alleen de opgemaakte naam. {prefix} voegt de naam in; › en spaties staan in elk bericht.
#   {reason}  reden of foutdetail
#   {seconds}  duur in seconden
#   {setting}  naam van de instelling
#   {target}  Doelspeler, entiteit of waarde
#   {title}  titeltekst
#   {type}  waarde- of gegevenstype
#   {value}  huidige of nieuwe waarde
#   {variables}  geldige tijdelijke aanduidingen
#   {version}  versie
#   {world}  wereldnaam

#   {section}  Sectie van de editor
#   {path}  Lokaal rapportpad
#   {url}  Rapport-URL

