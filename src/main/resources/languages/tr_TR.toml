# Rift dil dosyası (Türkçe - Türkiye).
# Bu dosya yalnızca eksikse indirilir; languages/tr_TR.toml dosyasını doğrudan düzenleyin.
# Yerel değişiklikler otomatik olarak değiştirilmez; eksik değerler İngilizceyi kullanır.
# Aşağıdaki mesajları düzenleyin; kaydedilen değişiklikler otomatik olarak algılanır ve uygulanır.
# Her yer tutucuyu süslü parantezleriyle birlikte tam olarak yazıldığı biçimde koruyun.
# Bir yer tutucuyu yalnızca varsayılan şablonunda tanımlandığı mesajlarda kullanın; desteklenmeyen yer tutucular değiştirilmez.
# Önek: {prefix}=genel runtime.prefix değeri. Yalnızca belirli bir iletide gizlemek için o iletiden {prefix} öğesini kaldırın.
# Kullanılabilir yer tutucular:
#
# {argument} - komut argümanı
# {category} - komut kategorisi
# {command} - komut metni veya adı
# {count} - öğe veya sonuç sayısı
# {detail} - açıklayıcı ayrıntı
# {id} - tanımlayıcı
# {key} - yapılandırma veya mesaj anahtarı
# {label} - görüntü etiketi
# {locale} - dil yerel ayarı
#   {personal}      kişisel yerel ayar
# {name} - girdi veya görüntü adı
# {operation} - işlem adı
# {parameter} - parametre adı
# {permission} - izin düğümü
# {player} - oyuncu adı
# {reason} - neden veya hata ayrıntısı
# {seconds} - saniye cinsinden süre
# {setting} - ayar adı
# {before} - önceki değer
# {after} - yeni değer
# {title} - başlık metni
# {type} - değer veya veri türü
# {usage} - komut kullanım metni
# {value} - geçerli veya yeni değer
# {version} - sürüm
# {world} - dünya adı
#

