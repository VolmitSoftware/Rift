# Rift — tr_TR
#
# === Dosyayı düzenleme ===
# plugins/Rift/languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyebilirsin. Yerel değişiklikler korunur; eksik veya geçersiz girdiler yerleşik İngilizce metni kullanır.
# /rift language server edit tr_TR
#
# === Önek ===
# runtime.prefix, {prefix} tarafından kullanılan biçimlendirilmiş eklenti adını saklar. Ayırıcıyı ve boşlukları mesajların kendisi sağlar. Sohbet önekini tamamen gizlemek için {prefix}&r &7› &7 kısmını kaldır.
#
# === Biçimlendirme ===
# Renkler ve stiller: &0-&f, &k-&r. RGB renkleri: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ve [RRGGBB]. Özel biçimlendirme için MiniMessage da kullanılabilir. & veya [ karakterini olduğu gibi göstermek için önüne ters eğik çizgi koy.
#
# === Değişkenler ===
# Değişken adlarını değiştirme ve yalnızca ilgili mesajın değişkenlerini kullan.
#   {added}  dil güncellemesiyle eklenen mesajlar
#   {after}  yeni değer
#   {argument}  komut argümanı
#   {before}  önceki değer
#   {category}  kategori
#   {command}  komut metni veya adı
#   {count}  öğe veya sonuç sayısı
#   {detail}  açıklayıcı ayrıntı
#   {group}  mesaj grubu
#   {id}  karantina kimliği
#   {kept}  dil güncellemesinde korunan yerel düzenlemeler
#   {key}  parametre veya mesaj anahtarı
#   {label}  görüntü etiketi
#   {line}  satır numarası
#   {locale}  dil kodu
#   {maximum}  en fazla girdi uzunluğu
#   {name}  girdi veya görüntü adı
#   {operation}  işlem adı
#   {parameter}  parametre adı
#   {permission}  izin düğümü
#   {personal}  sunucu varsayılanından farklıysa oyuncunun kişisel dili
#   {player}  oyuncu adı
#   {prefix}  runtime.prefix içindeki biçimlendirilmiş ad; ayırıcılar ve boşluklar her mesajın kendisine aittir
#   {reason}  neden veya hata ayrıntısı
#   {remaining}  bir sonraki dil denetimine kalan süre
#   {seconds}  saniye cinsinden süre
#   {setting}  ayar adı
#   {target}  seçim hedefi
#   {title}  başlık metni
#   {type}  değer veya veri türü
#   {updated}  dil güncellemesiyle değiştirilen mesajlar
#   {value}  geçerli veya yeni değer
#   {variables}  izin verilen yer tutucular
#   {version}  eklenti sürümü
#   {world}  dünya adı

#   {section}  düzenleyici bölümü
#   {path}  yerel rapor yolu
#   {url}  karşıya yüklenen raporun URL adresi

#   {step}  tıklama başına değişim miktarı

#   {limit}  en fazla oyuncu sayısı

