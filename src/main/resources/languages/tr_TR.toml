# Rift — tr_TR
#
# === Dosyayı düzenleme ===
# plugins/Rift/languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyebilirsiniz. Yerel değişiklikler korunur; eksik veya geçersiz girdiler yerleşik İngilizce metni kullanır.
# /rift language server edit tr_TR
#
# === Önek ===
# runtime.prefix yalnızca biçimlendirilmiş adı içerir. {prefix} adı ekler; › ve boşluklar her mesajda düzenlenir.
#
# === Biçimlendirme ===
# Renkler: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ve [RRGGBB]. Özel biçimlendirme için MiniMessage da kullanılabilir.
#
# === Değişkenler ===
# Değişken adlarını değiştirmeyin ve yalnızca ilgili iletinin değişkenlerini kullanın.
#   {after}  yeni değer
#   {argument}  komut argümanı
#   {before}  önceki değer
#   {category}  komut kategorisi
#   {command}  komut metni veya adı
#   {count}  öğe veya sonuç sayısı
#   {detail}  açıklayıcı ayrıntı
#   {group}  İzin veya oyuncu grubu
#   {id}  tanımlayıcı
#   {key}  yapılandırma veya mesaj anahtarı
#   {label}  görüntü etiketi
#   {line}  Source line or line number
#   {locale}  dil yerel ayarı
#   {maximum}  Maksimum izin verilen değer
#   {name}  girdi veya görüntü adı
#   {operation}  işlem adı
#   {parameter}  parametre adı
#   {permission}  izin düğümü
#   {personal}  kişisel yerel ayar
#   {player}  oyuncu adı
#   {prefix}  runtime.prefix yalnızca biçimlendirilmiş adı içerir. {prefix} adı ekler; › ve boşluklar her mesajda düzenlenir.
#   {reason}  neden veya hata ayrıntısı
#   {seconds}  saniye cinsinden süre
#   {setting}  ayar adı
#   {target}  Hedef oyuncu, varlık veya değer
#   {title}  başlık metni
#   {type}  değer veya veri türü
#   {value}  geçerli veya yeni değer
#   {variables}  geçerli yer tutucular
#   {version}  sürüm
#   {world}  dünya adı

#   {section}  Düzenleyici bölümü
#   {path}  Yerel rapor yolu
#   {url}  Rapor URL adresi

