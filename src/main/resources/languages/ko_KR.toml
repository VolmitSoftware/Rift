# Rift — ko_KR
#
# === 파일 편집 ===
# plugins/Rift/languages/ko_KR.toml
# 이 파일을 직접 편집할 수 있습니다. 로컬 변경은 유지되며, 누락되거나 잘못된 항목에는 내장 영어를 사용합니다.
# /rift language server edit ko_KR
#
# === 접두사 ===
# runtime.prefix에는 서식이 적용된 플러그인 이름만 저장되며, {prefix}가 이 이름을 삽입합니다. 구분 기호와 공백은 각 메시지에서 지정합니다. 채팅 접두사 전체를 숨기려면 {prefix}&r &7› &7을(를) 삭제하세요.
#
# === 서식 ===
# 색상: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB]. 사용자 지정 서식에는 MiniMessage도 사용할 수 있습니다. & 또는 [를 그대로 표시하려면 앞에 역슬래시를 붙이세요.
#
# === 변수 ===
# 변수 이름은 변경하지 말고 각 메시지에 속한 변수만 사용하세요.
#   {added}  언어 업데이트로 추가된 메시지
#   {after}  새 값
#   {argument}  인수
#   {before}  이전 값
#   {category}  카테고리
#   {command}  명령어 경로
#   {count}  항목 수
#   {detail}  항목 세부 정보
#   {group}  메시지 그룹
#   {id}  격리 ID
#   {kept}  언어 업데이트에서 유지된 로컬 편집
#   {key}  매개변수 키
#   {label}  표시 레이블
#   {line}  줄 번호
#   {locale}  로케일
#   {maximum}  최대 입력 길이
#   {name}  항목 이름
#   {operation}  작업
#   {parameter}  매개변수
#   {permission}  권한
#   {personal}  서버 기본값과 다를 때 플레이어의 개인 로케일
#   {player}  플레이어
#   {prefix}  runtime.prefix의 서식이 적용된 이름. 구분 기호와 공백은 각 메시지에서 지정합니다
#   {reason}  실패 세부 정보
#   {remaining}  다음 언어 확인이 가능해질 때까지 남은 시간
#   {seconds}  지속 시간(초)
#   {setting}  설정
#   {target}  선택 대상
#   {title}  섹션 제목
#   {type}  값 형식
#   {updated}  언어 업데이트로 변경된 메시지
#   {value}  현재 값 또는 새 값
#   {variables}  사용 가능한 자리표시자
#   {version}  플러그인 버전
#   {world}  월드

#   {section}  편집기 섹션
#   {path}  로컬 보고서 경로
#   {url}  업로드한 보고서 URL

#   {step}  클릭당 변경량

#   {limit}  월드에 입장할 수 있는 최대 플레이어 수

[runtime]
prefix = "<bold><gradient:#6f2dbd:#d16ba5>Rift</gradient></bold>"

