# Rift — ko_KR
#
# === 파일 편집 ===
# plugins/Rift/languages/ko_KR.toml
# 이 파일을 직접 편집할 수 있습니다. 로컬 변경은 유지되며, 누락되거나 잘못된 항목에는 내장 영어를 사용합니다.
# /rift language server edit ko_KR
#
# === 접두사 ===
# runtime.prefix에는 서식이 적용된 이름만 들어갑니다. {prefix}는 이름을 삽입합니다. ›와 공백은 각 메시지에서 수정하세요.
#
# === 서식 ===
# 색상: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB]. 사용자 지정 서식에는 MiniMessage도 사용할 수 있습니다.
#
# === 변수 ===
# 변수 이름을 변경하지 말고 각 메시지에 원래 있는 변수만 사용하세요.
#   {after}  새 값
#   {argument}  명령어 인수
#   {before}  이전 값
#   {category}  명령어 범주
#   {command}  명령어 텍스트 또는 이름
#   {count}  항목 또는 결과 수
#   {detail}  설명 세부 정보
#   {group}  권한 또는 선수 그룹
#   {id}  식별자
#   {key}  설정 또는 메시지 키
#   {label}  표시 레이블
#   {line}  소스 라인 또는 라인 번호
#   {locale}  언어 로캘
#   {maximum}  최대 허용 값
#   {name}  항목 또는 표시 이름
#   {operation}  작업 이름
#   {parameter}  매개변수 이름
#   {permission}  권한 노드
#   {personal}  개인 로케일
#   {player}  플레이어 이름
#   {prefix}  runtime.prefix에는 서식이 적용된 이름만 들어갑니다. {prefix}는 이름을 삽입합니다. ›와 공백은 각 메시지에서 수정하세요.
#   {reason}  이유 또는 오류 세부 정보
#   {seconds}  초 단위 시간
#   {setting}  설정 이름
#   {target}  대상 플레이어, 단체, 또는 가치
#   {title}  제목 텍스트
#   {type}  값 또는 데이터 형식
#   {value}  현재 값 또는 새 값
#   {variables}  사용 가능한 자리표시자
#   {version}  버전
#   {world}  월드 이름

#   {section}  편집기 섹션
#   {path}  로컬 보고서 경로
#   {url}  보고서 URL

#   {step}  클릭당 변경량

[runtime]
prefix = "<bold><gradient:#6f2dbd:#d16ba5>Rift</gradient></bold>"

