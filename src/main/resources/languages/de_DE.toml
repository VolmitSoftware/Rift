# Rift — de_DE
#
# === Datei bearbeiten ===
# plugins/Rift/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /rift language server edit de_DE
#
# === Präfix ===
# Präfix: {prefix}=der globale Wert runtime.prefix. Entferne {prefix} aus einer einzelnen Nachricht, um es dort auszublenden.
#
# === Formatierung ===
# Farben: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B und [RRGGBB]. MiniMessage bleibt für eigene Formatierungen verfügbar.
#
# === Variablen ===
# Variablennamen unverändert lassen und nur die Variablen der jeweiligen Nachricht verwenden.
#   {after}  neuer Wert
#   {argument}  Befehlsargument
#   {before}  vorheriger Wert
#   {category}  Befehlskategorie
#   {command}  Befehlstext oder -name
#   {count}  Anzahl der Einträge oder Ergebnisse
#   {detail}  beschreibendes Detail
#   {group}  Erlaubnis oder Spielergruppe
#   {id}  Bezeichner
#   {key}  Konfigurations- oder Nachrichtenschlüssel
#   {label}  Anzeigebezeichnung
#   {line}  Quellleitung oder Zeilennummer
#   {locale}  Sprachgebietsschema
#   {maximum}  Zulässiger Höchstwert
#   {name}  Eintrags- oder Anzeigename
#   {operation}  Vorgangsname
#   {parameter}  Parametername
#   {permission}  Berechtigungsknoten
#   {personal}  persönliche Sprachkennung
#   {player}  Spielername
#   {plugin}  Plugin Name
#   {prefix}  der globale Wert runtime.prefix. Entferne {prefix} aus einer einzelnen Nachricht, um es dort auszublenden.
#   {reason}  Grund oder Fehlerdetail
#   {seconds}  Dauer in Sekunden
#   {setting}  Einstellungsname
#   {target}  Zielspieler, Entität oder Wert
#   {title}  Titeltext
#   {type}  Wert- oder Datentyp
#   {usage}  Text zur Befehlsverwendung
#   {value}  aktueller oder neuer Wert
#   {variables}  gültige Platzhalter
#   {version}  Version
#   {world}  Weltname

