# Rift — de_DE
#
# === Datei bearbeiten ===
# plugins/Rift/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /rift language server edit de_DE
#
# === Präfix ===
# runtime.prefix enthält den formatierten Plugin-Namen, den {prefix} einfügt.
# Trennzeichen und Abstände stehen in der jeweiligen Nachricht. Entferne {prefix}&r &7› &7, um das gesamte Chat-Präfix auszublenden.
#
# === Formatierung ===
# Farben und Stile: &0-&f, &k-&r.
# RGB-Farben: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB].
# MiniMessage ermöglicht eigene Formatierungen. Setze einen Backslash vor & oder [, um das Zeichen wörtlich anzuzeigen.
#
# === Variablen ===
# Variablennamen unverändert lassen und nur die Variablen der jeweiligen Nachricht verwenden.
#   {added}  Durch eine Sprachaktualisierung hinzugefügte Nachrichten
#   {after}  neuer Wert
#   {argument}  Befehlsargument
#   {before}  vorheriger Wert
#   {category}  Kategorie
#   {command}  Befehlspfad
#   {count}  Anzahl der Einträge
#   {detail}  Eintragsdetail
#   {group}  Nachrichtengruppe
#   {id}  Quarantäne-ID
#   {kept}  Bei einer Sprachaktualisierung behaltene lokale Änderungen
#   {key}  Parameter- oder Nachrichtenschlüssel
#   {label}  Anzeigebezeichnung
#   {line}  Zeilennummer
#   {locale}  Sprachcode
#   {maximum}  maximale Eingabelänge
#   {name}  Eintragsname
#   {operation}  Vorgangsname
#   {parameter}  Parametername
#   {permission}  Berechtigungsknoten
#   {personal}  persönliche Sprache eines Spielers, wenn sie vom Serverstandard abweicht
#   {player}  Spielername
#   {prefix}  der formatierte Name aus runtime.prefix; Trennzeichen und Abstände stehen in der jeweiligen Nachricht
#   {reason}  Grund oder Fehlerdetail
#   {remaining}  Verbleibende Wartezeit bis zur nächsten Sprachprüfung
#   {seconds}  Dauer in Sekunden
#   {setting}  Einstellungsname
#   {target}  Auswahlziel
#   {title}  Abschnittstitel
#   {type}  Wert- oder Datentyp
#   {updated}  Durch eine Sprachaktualisierung geänderte Nachrichten
#   {value}  aktueller oder neuer Wert
#   {variables}  gültige Platzhalter
#   {version}  Plugin-Version
#   {world}  Weltname

#   {section}  Editorbereich
#   {path}  Lokaler Berichtspfad
#   {url}  URL des hochgeladenen Berichts

#   {step}  Änderung pro Klick

#   {limit}  maximale Spielerzahl einer Welt

