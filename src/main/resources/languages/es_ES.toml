# Rift — es_ES
#
# === Editar el archivo ===
# plugins/Rift/languages/es_ES.toml
# Puedes editar este archivo directamente. Los cambios locales se conservan; las entradas ausentes o no válidas usan el inglés incorporado.
# /rift language server edit es_ES
#
# === Prefijo ===
# runtime.prefix contiene solo el nombre con formato. {prefix} lo inserta; › y los espacios se editan en cada mensaje.
#
# === Formato ===
# Colores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B y [RRGGBB]. MiniMessage sigue disponible para formatos personalizados.
#
# === Variables ===
# Mantén los nombres de las variables y usa solo las que pertenecen a cada mensaje.
#   {added}  mensajes añadidos por una actualización de idioma
#   {after}  valor nuevo
#   {argument}  argumento del comando
#   {before}  valor anterior
#   {category}  categoría
#   {command}  ruta del comando
#   {count}  número de entradas
#   {detail}  detalle de la entrada
#   {group}  grupo de mensajes
#   {id}  ID de cuarentena
#   {kept}  ediciones locales conservadas por una actualización de idioma
#   {key}  clave del parámetro o del mensaje
#   {label}  etiqueta visible
#   {line}  número de línea
#   {locale}  código de idioma
#   {maximum}  longitud máxima de la entrada
#   {name}  nombre de la entrada
#   {operation}  nombre de la operación
#   {parameter}  nombre del parámetro
#   {permission}  nodo de permiso
#   {personal}  idioma personal de un jugador cuando difiere del predeterminado del servidor
#   {player}  nombre del jugador
#   {prefix}  nombre con formato de runtime.prefix; los separadores y espacios pertenecen a cada mensaje
#   {reason}  detalle del error
#   {remaining}  tiempo restante hasta la próxima comprobación de idiomas
#   {seconds}  duración en segundos
#   {setting}  nombre del ajuste
#   {target}  destino de la selección
#   {title}  título de la sección
#   {type}  tipo de valor
#   {updated}  mensajes cambiados por una actualización de idioma
#   {value}  valor actual o nuevo
#   {variables}  marcadores válidos
#   {version}  versión
#   {world}  nombre del mundo

#   {section}  sección del editor
#   {path}  ruta local del informe
#   {url}  URL del informe subido

#   {step}  cambio numérico por clic

#   {limit}  máximo de jugadores admitidos en un mundo

