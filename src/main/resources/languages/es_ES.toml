# Rift — es_ES
#
# === Editar el archivo ===
# plugins/Rift/languages/es_ES.toml
# Puede editar este archivo directamente. Los cambios locales se conservan; las entradas ausentes o no válidas usan el inglés incorporado.
# /rift language server edit es_ES
#
# === Prefijo ===
# Prefijo: {prefix}=el valor global runtime.prefix. Elimina {prefix} de un mensaje para ocultarlo solo allí.
#
# === Formato ===
# Colores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B y [RRGGBB]. MiniMessage sigue disponible para formatos personalizados.
#
# === Variables ===
# Mantenga los nombres de las variables y use solo las que ya contiene cada mensaje.
#   {after}  valor nuevo
#   {argument}  argumento del comando
#   {before}  valor anterior
#   {category}  categoría del comando
#   {command}  texto o nombre del comando
#   {count}  cantidad de elementos o resultados
#   {detail}  detalle descriptivo
#   {group}  Grupo de permisos o jugadores
#   {id}  identificador
#   {key}  clave de configuración o mensaje
#   {label}  etiqueta visible
#   {line}  Línea de origen o número de línea
#   {locale}  configuración regional del idioma
#   {maximum}  Valor máximo permitido
#   {name}  nombre de entrada o visible
#   {operation}  nombre de la operación
#   {parameter}  nombre del parámetro
#   {permission}  nodo de permiso
#   {personal}  configuración regional personal
#   {player}  nombre del jugador
#   {plugin}  Nombre de plugin
#   {prefix}  el valor global runtime.prefix. Elimina {prefix} de un mensaje para ocultarlo solo allí.
#   {reason}  motivo o detalle del error
#   {seconds}  duración en segundos
#   {setting}  nombre del ajuste
#   {target}  Objetivo jugador, entidad o valor
#   {title}  texto del título
#   {type}  tipo de valor o dato
#   {usage}  texto de uso del comando
#   {value}  valor actual o nuevo
#   {variables}  marcadores válidos
#   {version}  versión
#   {world}  nombre del mundo

